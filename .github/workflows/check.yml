name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sitemap coverage
        run: python3 scripts/build_sitemap.py --check
      - name: Broken internal link check
        run: python3 scripts/check_links.py --no-external
