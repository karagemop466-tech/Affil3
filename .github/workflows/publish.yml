# CI gate for the Affil3 / ShopNow Kitchen site.
# Re-runs the generator, fails on hand-edited HTML drift, then runs the publishing gate
# (disclosure placement, sponsored attributes, tagged links, no prices, sitemap/feed
# coverage, internal links, analytics allowlist). A failing gate blocks merge.
name: publish-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate the site
        run: node tools/build.mjs
      - name: Fail on drift (generated files must match the registers)
        run: |
          git diff --stat
          git diff --exit-code -- index.html shop products categories guides articles decisions how-we-choose executive-summary sources questions suggestions flagged ledger measurement compliance about workflow privacy 404.html feed.xml sitemap.xml robots.txt assets .nojekyll
      - name: Run the publishing gate
        run: node tools/verify.mjs
