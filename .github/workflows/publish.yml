# CI gate for the Affil3 / ShopNow Kitchen site.
# Re-runs the generator, fails on hand-edited HTML drift, then runs the publishing gate
# (disclosure placement, sponsored attributes, tagged links, no prices, sitemap/feed
# coverage, internal links, analytics allowlist). A failing gate blocks merge.
name: publish-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate the site
        run: node tools/build.mjs
      - name: Fail on drift (generated files must match the registers)
        run: |
          git diff --stat
          git diff --exit-code -- index.html shop compare find design-brief products categories guides articles decisions how-we-choose executive-summary sources questions suggestions flagged ledger measurement compliance about workflow privacy 404.html feed.xml sitemap.xml robots.txt assets .nojekyll
      - name: Run the publishing gate
        # The gate's own output is the useful part of a red run, and Actions logs are not always
        # readable from an API-only environment. Repeating each failure as an annotation puts it in
        # the Checks UI and on the PR, so a broken gate is diagnosable without leaving the API.
        run: |
          set +e
          node --version
          out=$(node tools/verify.mjs 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            # Both shapes of a red gate are reported: a failed check prints FAIL lines, an
            # unexpected throw prints a stack. Annotate whichever came out, escaping the
            # characters that would otherwise break the workflow command.
            printf '%s\n' "$out" | tail -40 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              printf '::error::%s\n' "$line"
            done
            exit "$rc"
          fi
