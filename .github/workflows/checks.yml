name: Publication gate

# Runs the generator and the 7-rule gate on every push and pull request.
# A failing gate means the site is not publishable, and the step exits non-zero,
# which marks the commit red in GitHub.
#
# This workflow deliberately does NOT deploy. Deployment is handled by GitHub
# Pages from the branch directly, so the gate is a check rather than a blocker
# on the Pages pipeline; the integration session only merges when this is green.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show toolchain
        run: node --version

      - name: Rebuild every page from data
        run: node tools/build.mjs

      - name: Fail if the committed output drifts from the generator
        run: |
          if [ -n "$(git status --porcelain -- '*.html' 'sitemap.xml' 'feed.xml' 'robots.txt')" ]; then
            echo "::error::Generated files are out of date. Run 'node tools/build.mjs' and commit the result."
            git status --porcelain -- '*.html' 'sitemap.xml' 'feed.xml' 'robots.txt'
            exit 1
          fi
          echo "Generated output matches the data."

      - name: Publication gate
        run: node tools/validate.mjs

      - name: Structural check (headings, landmarks, tag balance)
        run: node tools/structure.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "### Publication gate"
            echo ""
            echo "- pages: $(find . -name '*.html' -not -path './.git/*' | wc -l)"
            echo "- guides: $(ls content/guides/*.md | wc -l)"
            echo "- claims with sources: $(node -e "const c=require('./data/claims.json');console.log(c.claims.filter(x=>x.source).length)")"
            echo "- open flags: $(node -e "const f=require('./data/flags.json');console.log(f.flags.length)")"
          } >> "$GITHUB_STEP_SUMMARY"
