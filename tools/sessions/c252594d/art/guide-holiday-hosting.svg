<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="evening" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8EDD9"/>
      <stop offset="0.5" stop-color="#F0E1C9"/>
      <stop offset="1" stop-color="#E7D5B8"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.9" fill="#2a241c" opacity="0.05"/>
      <circle cx="6.5" cy="7" r="0.7" fill="#2a241c" opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5C97A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F5C97A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#evening)"/>
  <rect width="1536" height="1024" fill="url(#grain)"/>
  <circle cx="740" cy="450" r="500" fill="url(#glow)"/>

  <!-- window -->
  <g>
    <rect x="92" y="96" width="316" height="352" rx="10" fill="#D9C5A2"/>
    <rect x="108" y="112" width="284" height="320" rx="6" fill="#CBD6CF"/>
    <rect x="108" y="112" width="284" height="320" rx="6" fill="#E8C88A" opacity="0.4"/>
    <line x1="250" y1="112" x2="250" y2="432" stroke="#D9C5A2" stroke-width="11"/>
    <line x1="108" y1="272" x2="392" y2="272" stroke="#D9C5A2" stroke-width="11"/>
  </g>

  <!-- shelf with jars -->
  <rect x="1096" y="286" width="356" height="13" rx="6" fill="#B98B58"/>
  <g>
    <rect x="1136" y="218" width="58" height="68" rx="9" fill="#DCC9A6"/>
    <rect x="1142" y="208" width="46" height="13" rx="6" fill="#B4532A"/>
    <rect x="1214" y="234" width="48" height="52" rx="8" fill="#C6D3BE"/>
    <rect x="1220" y="224" width="36" height="13" rx="6" fill="#5F6F48"/>
    <rect x="1282" y="228" width="62" height="58" rx="9" fill="#E5D6B8"/>
    <rect x="1290" y="216" width="46" height="13" rx="6" fill="#C89A3D"/>
  </g>

  <!-- counter -->
  <rect x="0" y="790" width="1536" height="34" fill="#B4532A"/>
  <rect x="0" y="824" width="1536" height="200" fill="#E2D3B8"/>
  <rect x="0" y="824" width="1536" height="7" fill="#93431F" opacity="0.4"/>

  <!-- air fryer -->
  <g transform="translate(196 500)">
    <rect x="0" y="0" width="256" height="290" rx="48" fill="#5F6F48"/>
    <rect x="0" y="0" width="256" height="72" rx="36" fill="#E9ECDD"/>
    <rect x="84" y="24" width="88" height="24" rx="12" fill="#5F6F48"/>
    <circle cx="206" cy="36" r="13" fill="#C89A3D"/>
    <rect x="26" y="92" width="204" height="162" rx="12" fill="#2F2820"/>
    <rect x="38" y="104" width="180" height="138" rx="9" fill="#F0E6D3"/>
    <!-- roasted vegetables -->
    <g>
      <ellipse cx="86" cy="168" rx="27" ry="24" fill="#D98A3C"/>
      <ellipse cx="148" cy="196" rx="25" ry="22" fill="#C8702F"/>
      <ellipse cx="184" cy="152" rx="23" ry="21" fill="#E0A64E"/>
      <ellipse cx="116" cy="222" rx="21" ry="19" fill="#B9632C"/>
      <ellipse cx="188" cy="212" rx="18" ry="17" fill="#D98A3C"/>
      <path d="M82 148 C70 128 74 114 84 108 C96 120 100 138 92 152 Z" fill="#6E7F52"/>
      <path d="M142 174 C132 158 134 146 142 140 C152 150 156 164 150 176 Z" fill="#7C8B5E"/>
    </g>
  </g>

  <!-- countertop oven with roast -->
  <g transform="translate(520 372)">
    <rect x="0" y="0" width="376" height="418" rx="22" fill="#3A342D"/>
    <rect x="14" y="14" width="348" height="390" rx="13" fill="#EFE7D7"/>
    <rect x="40" y="40" width="146" height="20" rx="10" fill="#DCCFB4"/>
    <rect x="40" y="86" width="284" height="240" rx="10" fill="#2A241C"/>
    <rect x="52" y="98" width="260" height="216" rx="7" fill="#F6E3C7"/>
    <!-- roast -->
    <g transform="translate(182 214)">
      <ellipse cx="0" cy="0" rx="98" ry="70" fill="#C88A4B"/>
      <ellipse cx="0" cy="-12" rx="98" ry="66" fill="#D79C5A"/>
      <ellipse cx="-24" cy="-30" rx="50" ry="26" fill="#E4B27A" opacity="0.9"/>
      <!-- drumsticks -->
      <path d="M-72 -40 C-100 -62 -118 -78 -128 -92 C-98 -90 -66 -74 -46 -50 Z" fill="#E8C88A"/>
      <path d="M72 -40 C100 -62 118 -78 128 -92 C98 -90 66 -74 46 -50 Z" fill="#E8C88A"/>
      <rect x="-14" y="-62" width="28" height="34" rx="13" fill="#F3EAD6"/>
      <!-- trussing string -->
      <path d="M-72 -18 C-20 6 20 6 72 -18" stroke="#B9895A" stroke-width="5" fill="none"/>
    </g>
    <rect x="52" y="98" width="260" height="216" rx="7" fill="#F5B04E" opacity="0.2"/>
    <g stroke="#DCCFB4" stroke-width="6">
      <line x1="52" y1="278" x2="312" y2="278"/>
    </g>
    <rect x="40" y="348" width="122" height="24" rx="12" fill="#E3D6BC"/>
    <circle cx="332" cy="360" r="17" fill="#B4532A"/>
  </g>

  <!-- thermometer standing on the counter -->
  <g transform="translate(1020 560)">
    <rect x="46" y="70" width="40" height="160" rx="18" fill="#2A241C"/>
    <rect x="54" y="82" width="24" height="66" rx="10" fill="#D7E2DA"/>
    <circle cx="66" cy="118" r="9" fill="#7C8B5E"/>
    <rect x="58" y="0" width="16" height="76" rx="8" fill="#B9BEC4"/>
    <circle cx="66" cy="4" r="10" fill="#8E939A"/>
  </g>

  <!-- linen cloth -->
  <g>
    <path d="M1160 748 C1214 726 1286 730 1338 752 L1338 790 L1156 790 Z" fill="#EFE6D3"/>
    <path d="M1160 748 C1208 738 1236 762 1264 790 L1156 790 Z" fill="#E0D2B6"/>
  </g>

  <!-- autumn leaves resting on the counter -->
  <g>
    <path d="M336 772 C364 748 406 748 420 768 C398 792 356 794 336 772 Z" fill="#B4532A"/>
    <path d="M424 778 C452 758 488 760 500 778 C482 798 444 798 424 778 Z" fill="#C87A3C"/>
    <path d="M1188 768 C1212 746 1248 746 1262 766 C1242 786 1206 788 1188 768 Z" fill="#C89A3D"/>
  </g>

  <!-- caption -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="768" y="920" font-size="38" fill="#7A5B34">one small counter, one big meal</text>
    <text x="768" y="962" font-size="27" fill="#A08A6A">cook the vegetables first, roast the bird, then take the temperatures</text>
  </g>
</svg>
