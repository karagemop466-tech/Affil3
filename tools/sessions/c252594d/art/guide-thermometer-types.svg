<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F2EADC"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.9" fill="#2a241c" opacity="0.05"/>
      <circle cx="6.5" cy="7" r="0.7" fill="#2a241c" opacity="0.04"/>
    </pattern>
    <pattern id="tile" width="112" height="56" patternUnits="userSpaceOnUse">
      <rect width="112" height="56" fill="#F1E7D6"/>
      <rect width="56" height="56" fill="#E9DCC4"/>
      <rect x="56" y="0" width="56" height="28" fill="#E4D8BF"/>
      <rect x="0" y="28" width="56" height="28" fill="#E4D8BF"/>
      <rect width="112" height="56" fill="none" stroke="#DCCDB0" stroke-width="2"/>
    </pattern>
    <pattern id="wood" width="120" height="40" patternUnits="userSpaceOnUse">
      <rect width="120" height="40" fill="#C99A62"/>
      <path d="M0 12 C30 6 70 18 120 10" stroke="#B88A55" stroke-width="3" fill="none"/>
      <path d="M0 28 C34 34 76 22 120 30" stroke="#B88A55" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#wall)"/>
  <rect width="1536" height="1024" fill="url(#grain)"/>
  <rect x="0" y="250" width="1536" height="380" fill="url(#tile)" opacity="0.85"/>
  <rect x="0" y="246" width="1536" height="6" fill="#C9B795"/>

  <!-- counter -->
  <rect x="0" y="700" width="1536" height="40" fill="#B4532A"/>
  <rect x="0" y="740" width="1536" height="284" fill="#E7DCC7"/>

  <!-- left: hand holding instant read probe -->
  <g transform="translate(60 30)">
    <!-- cutting board -->
    <rect x="0" y="560" width="620" height="150" rx="18" fill="#D8B283"/>
    <rect x="0" y="560" width="620" height="18" rx="9" fill="#C79C68"/>
    <!-- steak on board -->
    <ellipse cx="300" cy="612" rx="150" ry="62" fill="#A9563F"/>
    <ellipse cx="300" cy="600" rx="150" ry="60" fill="#B85F45"/>
    <ellipse cx="270" cy="592" rx="86" ry="32" fill="#C67055" opacity="0.8"/>
    <!-- probe -->
    <rect x="292" y="404" width="13" height="180" rx="6" fill="#C9CDD2" transform="rotate(24 298 494)"/>
    <circle cx="281" cy="576" r="9" fill="#8E939A"/>
    <!-- thermometer body -->
    <g transform="rotate(-16 250 400)">
      <rect x="196" y="300" width="112" height="196" rx="40" fill="#2A241C"/>
      <rect x="206" y="312" width="92" height="86" rx="14" fill="#D7E2DA"/>
      <rect x="222" y="332" width="60" height="12" rx="6" fill="#7C8B5E" opacity="0.7"/>
      <rect x="222" y="354" width="42" height="12" rx="6" fill="#7C8B5E" opacity="0.45"/>
      <circle cx="252" cy="428" r="26" fill="#B4532A"/>
      <circle cx="252" cy="428" r="11" fill="#F4DFD2"/>
    </g>
    <!-- hand -->
    <path d="M392 250 C438 244 470 272 470 312 C470 356 440 386 400 386 L360 386 C330 386 312 366 316 340 C320 314 348 254 392 250 Z" fill="#D8A57C"/>
    <path d="M470 312 C486 320 492 340 484 356 C476 372 456 376 444 368" fill="#D8A57C"/>
    <path d="M330 300 C356 292 386 296 404 312" stroke="#C48F68" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M330 332 C356 324 386 328 404 344" stroke="#C48F68" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- right: wireless leave-in probe in a base -->
  <g transform="translate(900 60)">
    <!-- charging base -->
    <ellipse cx="250" cy="700" rx="180" ry="34" fill="#D8CDB6"/>
    <rect x="70" y="600" width="360" height="102" rx="34" fill="#5F6F48"/>
    <rect x="70" y="600" width="360" height="30" rx="15" fill="#7C8B5E"/>
    <circle cx="250" cy="662" r="20" fill="#D7E2DA"/>
    <circle cx="250" cy="662" r="8" fill="#5F6F48"/>
    <!-- probe standing in base -->
    <rect x="228" y="392" width="44" height="212" rx="20" fill="#2A241C"/>
    <rect x="236" y="404" width="28" height="86" rx="12" fill="#D7E2DA"/>
    <circle cx="250" cy="470" r="9" fill="#7C8B5E"/>
    <rect x="240" y="196" width="20" height="204" rx="10" fill="#B9BEC4"/>
    <circle cx="250" cy="196" r="11" fill="#8E939A"/>
    <!-- signal arcs -->
    <g stroke="#C89A3D" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M296 300 A92 92 0 0 1 296 396"/>
      <path d="M330 262 A140 140 0 0 1 330 434"/>
    </g>
    <circle cx="250" cy="332" r="13" fill="#C89A3D"/>
  </g>

  <!-- divider -->
  <line x1="860" y1="300" x2="860" y2="700" stroke="#DCCDB0" stroke-width="4" stroke-dasharray="12 12"/>

  <!-- labels -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#7A5B34">
    <text x="300" y="904" font-size="34" text-anchor="middle">spot check</text>
    <text x="1150" y="904" font-size="34" text-anchor="middle">watches the cook</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#A08A6A" font-size="26">
    <text x="300" y="944" text-anchor="middle">a reading in seconds</text>
    <text x="1150" y="944" text-anchor="middle">a reading from another room</text>
  </g>
</svg>
