<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F2EADC"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.9" fill="#2a241c" opacity="0.05"/>
      <circle cx="6.5" cy="7" r="0.7" fill="#2a241c" opacity="0.04"/>
    </pattern>
    <pattern id="wood" width="130" height="42" patternUnits="userSpaceOnUse">
      <rect width="130" height="42" fill="#C99A62"/>
      <path d="M0 13 C34 6 78 20 130 11" stroke="#B88A55" stroke-width="3" fill="none"/>
      <path d="M0 30 C38 37 82 24 130 32" stroke="#B88A55" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#wall)"/>
  <rect width="1536" height="1024" fill="url(#grain)"/>

  <!-- desk -->
  <rect x="0" y="700" width="1536" height="324" fill="url(#wood)"/>
  <rect x="0" y="700" width="1536" height="14" fill="#B98B58"/>
  <rect x="0" y="700" width="1536" height="324" fill="#2A241C" opacity="0.04"/>

  <!-- laptop / tablet showing a listing -->
  <g transform="translate(180 150)">
    <rect x="0" y="0" width="700" height="500" rx="26" fill="#3A342D"/>
    <rect x="18" y="18" width="664" height="464" rx="14" fill="#FBF7F0"/>
    <!-- browser chrome -->
    <rect x="18" y="18" width="664" height="52" rx="14" fill="#EDE4D2"/>
    <rect x="18" y="56" width="664" height="14" fill="#EDE4D2"/>
    <circle cx="46" cy="44" r="7" fill="#C9704A"/>
    <circle cx="68" cy="44" r="7" fill="#C89A3D"/>
    <circle cx="90" cy="44" r="7" fill="#7C8B5E"/>
    <rect x="116" y="34" width="440" height="20" rx="10" fill="#FBF7F0"/>
    <!-- listing title bars -->
    <rect x="44" y="98" width="380" height="22" rx="11" fill="#B9AE97"/>
    <rect x="44" y="132" width="300" height="18" rx="9" fill="#D6CBB6"/>
    <!-- product image placeholder -->
    <rect x="44" y="176" width="300" height="270" rx="10" fill="#E6DCC8"/>
    <rect x="96" y="228" width="196" height="140" rx="18" fill="#B4532A"/>
    <rect x="112" y="252" width="164" height="44" rx="18" fill="#F4DFD2"/>
    <circle cx="194" cy="274" r="13" fill="#B4532A"/>
    <!-- spec rows -->
    <g fill="#D6CBB6">
      <rect x="380" y="176" width="270" height="16" rx="8"/>
      <rect x="380" y="212" width="230" height="16" rx="8"/>
      <rect x="380" y="248" width="256" height="16" rx="8"/>
      <rect x="380" y="284" width="204" height="16" rx="8"/>
    </g>
    <g fill="#B9AE97">
      <rect x="380" y="320" width="120" height="16" rx="8"/>
      <rect x="380" y="356" width="248" height="16" rx="8"/>
      <rect x="380" y="392" width="176" height="16" rx="8"/>
    </g>
    <rect x="44" y="424" width="200" height="34" rx="17" fill="#D8CDB4"/>
  </g>

  <!-- magnifying glass over the listing -->
  <g transform="translate(700 300)">
    <circle cx="0" cy="0" r="132" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="0" cy="0" r="132" fill="none" stroke="#B4532A" stroke-width="20"/>
    <circle cx="0" cy="0" r="132" fill="none" stroke="#93431F" stroke-width="6"/>
    <rect x="96" y="86" width="40" height="210" rx="20" fill="#5F6F48" transform="rotate(-42 116 190)"/>
    <rect x="104" y="98" width="20" height="150" rx="10" fill="#7C8B5E" transform="rotate(-42 116 190)"/>
  </g>

  <!-- right: the maker's own page card -->
  <g transform="translate(1080 250)">
    <rect x="0" y="0" width="380" height="470" rx="20" fill="#FBF7F0" stroke="#D8CDB4" stroke-width="4"/>
    <rect x="26" y="28" width="240" height="20" rx="10" fill="#5F6F48"/>
    <rect x="26" y="60" width="300" height="14" rx="7" fill="#D6CBB6"/>
    <rect x="26" y="98" width="328" height="150" rx="10" fill="#EDE3CF"/>
    <rect x="120" y="128" width="140" height="90" rx="14" fill="#B4532A"/>
    <rect x="132" y="146" width="116" height="30" rx="12" fill="#F4DFD2"/>
    <g fill="#C6B99E">
      <rect x="26" y="272" width="300" height="14" rx="7"/>
      <rect x="26" y="300" width="270" height="14" rx="7"/>
      <rect x="26" y="328" width="312" height="14" rx="7"/>
      <rect x="26" y="356" width="228" height="14" rx="7"/>
    </g>
    <rect x="26" y="396" width="150" height="30" rx="15" fill="#5F6F48"/>
  </g>

  <!-- check marks -->
  <g stroke="#5F6F48" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1010 800 L1050 840 L1130 748"/>
  </g>
  <g stroke="#B4532A" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M1206 780 L1240 814 L1310 730"/>
  </g>
  <g stroke="#C89A3D" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M1274 840 L1300 866 L1358 800"/>
  </g>

  <!-- small note card -->
  <g transform="translate(120 760) rotate(-6)">
    <rect x="0" y="0" width="330" height="140" rx="12" fill="#FBF7F0"/>
    <rect x="0" y="0" width="330" height="140" rx="12" fill="none" stroke="#D8CDB4" stroke-width="3"/>
    <g fill="#C6B99E">
      <rect x="30" y="34" width="240" height="12" rx="6"/>
      <rect x="30" y="62" width="200" height="12" rx="6"/>
      <rect x="30" y="90" width="264" height="12" rx="6"/>
    </g>
  </g>
</svg>
