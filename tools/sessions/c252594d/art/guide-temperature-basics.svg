<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F2EADC"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.9" fill="#2a241c" opacity="0.05"/>
      <circle cx="6.5" cy="7" r="0.7" fill="#2a241c" opacity="0.04"/>
    </pattern>
    <pattern id="wood" width="130" height="42" patternUnits="userSpaceOnUse">
      <rect width="130" height="42" fill="#C99A62"/>
      <path d="M0 13 C34 6 78 20 130 11" stroke="#B88A55" stroke-width="3" fill="none"/>
      <path d="M0 30 C38 37 82 24 130 32" stroke="#B88A55" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="board" width="150" height="46" patternUnits="userSpaceOnUse">
      <rect width="150" height="46" fill="#C39A64"/>
      <path d="M0 14 C38 7 86 22 150 12" stroke="#AE8350" stroke-width="3" fill="none"/>
      <path d="M0 32 C44 39 92 26 150 34" stroke="#AE8350" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#wall)"/>
  <rect width="1536" height="1024" fill="url(#grain)"/>

  <!-- counter -->
  <rect x="0" y="616" width="1536" height="408" fill="url(#wood)"/>
  <rect x="0" y="616" width="1536" height="16" fill="#B98B58"/>
  <rect x="0" y="616" width="1536" height="408" fill="#2A241C" opacity="0.04"/>

  <!-- cutting board -->
  <g transform="translate(60 400)">
    <rect x="0" y="0" width="900" height="290" rx="24" fill="#B08A5A"/>
    <rect x="0" y="0" width="900" height="18" rx="9" fill="#C29C6C"/>
    <circle cx="858" cy="56" r="17" fill="#9A7648"/>
    <rect x="16" y="26" width="868" height="248" rx="14" fill="url(#board)"/>
  </g>

  <!-- raw chicken breast, side profile: thick round end on the left, tapering to a point on the right -->
  <g transform="translate(300 592)">
    <path d="M-176 26 C-186 -32 -142 -82 -70 -96 C4 -110 82 -92 150 -54 C198 -28 236 4 268 34 C212 60 158 76 84 80 C6 84 -84 76 -136 58 C-158 52 -170 42 -176 26 Z" fill="#E9C6A2"/>
    <path d="M-150 20 C-158 -22 -124 -60 -62 -72 C4 -84 72 -70 132 -38 C176 -14 208 8 236 32 C186 54 136 66 74 68 C4 72 -78 66 -120 50 C-140 44 -148 32 -150 20 Z" fill="#F2D7B8"/>
    <path d="M-84 -40 C-40 -56 12 -50 46 -30" stroke="#E0BC98" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-70 22 C-24 40 46 40 106 22" stroke="#E0BC98" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-26 -8 C4 -14 40 -6 62 10" stroke="#E0BC98" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- probe pushed into the thickest part -->
  <g>
    <rect x="284" y="486" width="16" height="132" rx="8" fill="#C9CDD2"/>
    <circle cx="292" cy="614" r="11" fill="#8E939A"/>
    <g transform="rotate(-26 292 486)">
      <rect x="244" y="316" width="96" height="176" rx="36" fill="#2A241C"/>
      <rect x="253" y="328" width="78" height="70" rx="13" fill="#D7E2DA"/>
      <rect x="266" y="344" width="52" height="11" rx="5" fill="#7C8B5E" opacity="0.85"/>
      <rect x="266" y="365" width="34" height="11" rx="5" fill="#7C8B5E" opacity="0.55"/>
      <circle cx="292" cy="438" r="21" fill="#B4532A"/>
    </g>
  </g>

  <!-- right: dial with a target marker -->
  <g transform="translate(1112 178)">
    <circle cx="150" cy="170" r="158" fill="#E4D8BF"/>
    <circle cx="150" cy="170" r="124" fill="#FBF7F0"/>
    <g stroke="#C6B99E" stroke-width="5" stroke-linecap="round">
      <line x1="150" y1="58" x2="150" y2="84"/>
      <line x1="150" y1="256" x2="150" y2="282"/>
      <line x1="38" y1="170" x2="64" y2="170"/>
      <line x1="236" y1="170" x2="262" y2="170"/>
      <line x1="68" y1="88" x2="86" y2="106"/>
      <line x1="214" y1="234" x2="232" y2="252"/>
      <line x1="68" y1="252" x2="86" y2="234"/>
      <line x1="214" y1="106" x2="232" y2="88"/>
    </g>
    <path d="M150 46 A124 124 0 0 1 258 234" fill="none" stroke="#B4532A" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M150 46 A124 124 0 0 1 100 55" fill="none" stroke="#C89A3D" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 170 L224 116" stroke="#2A241C" stroke-width="12" stroke-linecap="round"/>
    <circle cx="150" cy="170" r="22" fill="#2A241C"/>
    <g transform="translate(214 54)">
      <circle cx="0" cy="0" r="40" fill="#5F6F48"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#7C8B5E" stroke-width="5"/>
      <path d="M-14 -4 L-4 8 L16 -14" stroke="#FBF7F0" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- caption -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <rect x="176" y="866" width="1184" height="128" rx="22" fill="#FBF7F0" opacity="0.94"/>
    <text x="768" y="918" font-size="38" fill="#7A5B34">the reading is the proof, not the timer</text>
    <text x="768" y="964" font-size="25" fill="#8A7458">probe the thickest part, compare it with the target temperature, then take it out</text>
  </g>
</svg>
