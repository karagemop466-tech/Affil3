<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F2EADC"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.9" fill="#2a241c" opacity="0.05"/>
      <circle cx="6.5" cy="7" r="0.7" fill="#2a241c" opacity="0.04"/>
    </pattern>
    <pattern id="tile" width="112" height="56" patternUnits="userSpaceOnUse">
      <rect width="112" height="56" fill="#F1E7D6"/>
      <rect width="56" height="56" fill="#E9DCC4"/>
      <rect x="56" y="0" width="56" height="28" fill="#E4D8BF"/>
      <rect x="0" y="28" width="56" height="28" fill="#E4D8BF"/>
      <rect width="112" height="56" fill="none" stroke="#DCCDB0" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#wall)"/>
  <rect width="1536" height="1024" fill="url(#grain)"/>
  <rect x="0" y="300" width="1536" height="340" fill="url(#tile)" opacity="0.85"/>
  <rect x="0" y="296" width="1536" height="6" fill="#C9B795"/>

  <!-- window with light -->
  <g>
    <rect x="112" y="92" width="330" height="330" rx="10" fill="#EADFCB"/>
    <rect x="130" y="110" width="294" height="294" rx="6" fill="#DCE6DF"/>
    <rect x="130" y="110" width="294" height="294" rx="6" fill="#FBF7F0" opacity="0.35"/>
    <line x1="277" y1="110" x2="277" y2="404" stroke="#EADFCB" stroke-width="10"/>
    <line x1="130" y1="257" x2="424" y2="257" stroke="#EADFCB" stroke-width="10"/>
    <path d="M150 130 L230 130 L170 384 L150 384 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- worktop -->
  <rect x="0" y="806" width="1536" height="30" fill="#B4532A"/>
  <rect x="0" y="836" width="1536" height="188" fill="#E7DCC7"/>
  <rect x="0" y="836" width="1536" height="7" fill="#93431F" opacity="0.5"/>

  <!-- long counter with three appliances far apart -->
  <!-- 1. basket air fryer -->
  <g>
    <rect x="214" y="560" width="230" height="246" rx="48" fill="#5F6F48"/>
    <rect x="214" y="560" width="230" height="68" rx="34" fill="#E9ECDD"/>
    <rect x="290" y="586" width="78" height="22" rx="11" fill="#5F6F48"/>
    <circle cx="400" cy="597" r="13" fill="#C89A3D"/>
    <rect x="256" y="666" width="146" height="26" rx="13" fill="#E9ECDD"/>
    <rect x="272" y="716" width="114" height="18" rx="9" fill="#3E4A31" opacity="0.45"/>
  </g>

  <!-- 2. toaster oven -->
  <g>
    <rect x="654" y="500" width="320" height="306" rx="20" fill="#4C4740"/>
    <rect x="668" y="514" width="292" height="278" rx="12" fill="#EFE8DA"/>
    <rect x="700" y="546" width="180" height="20" rx="10" fill="#DCCFB4"/>
    <rect x="700" y="590" width="230" height="140" rx="10" fill="#2F2820"/>
    <rect x="712" y="602" width="206" height="116" rx="6" fill="#F1E8D6"/>
    <line x1="712" y1="640" x2="918" y2="640" stroke="#DCCFB4" stroke-width="5"/>
    <line x1="712" y1="678" x2="918" y2="678" stroke="#DCCFB4" stroke-width="5"/>
    <circle cx="944" cy="612" r="16" fill="#B4532A"/>
    <circle cx="944" cy="672" r="16" fill="#C89A3D"/>
    <rect x="700" y="748" width="120" height="22" rx="11" fill="#DCCFB4"/>
  </g>

  <!-- 3. microwave -->
  <g>
    <rect x="1118" y="530" width="300" height="276" rx="16" fill="#8C8478"/>
    <rect x="1132" y="544" width="272" height="248" rx="10" fill="#F3EDE0"/>
    <rect x="1152" y="570" width="186" height="196" rx="8" fill="#2F2820"/>
    <rect x="1164" y="582" width="162" height="172" rx="5" fill="#DFE3D8"/>
    <line x1="1164" y1="600" x2="1326" y2="600" stroke="#CBD3C4" stroke-width="4"/>
    <circle cx="1372" cy="606" r="13" fill="#B4532A"/>
    <rect x="1352" y="646" width="40" height="100" rx="8" fill="#E3D6BC"/>
    <circle cx="1372" cy="672" r="9" fill="#8C8478"/>
    <rect x="1352" y="700" width="40" height="34" rx="6" fill="#8C8478" opacity="0.4"/>
  </g>

  <!-- measuring tape along the front of the counter -->
  <g transform="rotate(-4 768 950)">
    <rect x="180" y="906" width="1180" height="56" rx="8" fill="#E8C88A"/>
    <rect x="180" y="906" width="1180" height="14" rx="7" fill="#D9B26A"/>
    <g stroke="#8A6534" stroke-width="2" opacity="0.75">
      <line x1="228" y1="906" x2="228" y2="944"/><line x1="276" y1="906" x2="276" y2="930"/>
      <line x1="324" y1="906" x2="324" y2="944"/><line x1="372" y1="906" x2="372" y2="930"/>
      <line x1="420" y1="906" x2="420" y2="944"/><line x1="468" y1="906" x2="468" y2="930"/>
      <line x1="516" y1="906" x2="516" y2="944"/><line x1="564" y1="906" x2="564" y2="930"/>
      <line x1="612" y1="906" x2="612" y2="944"/><line x1="660" y1="906" x2="660" y2="930"/>
      <line x1="708" y1="906" x2="708" y2="944"/><line x1="756" y1="906" x2="756" y2="930"/>
      <line x1="804" y1="906" x2="804" y2="944"/><line x1="852" y1="906" x2="852" y2="930"/>
      <line x1="900" y1="906" x2="900" y2="944"/><line x1="948" y1="906" x2="948" y2="930"/>
      <line x1="996" y1="906" x2="996" y2="944"/><line x1="1044" y1="906" x2="1044" y2="930"/>
      <line x1="1092" y1="906" x2="1092" y2="944"/><line x1="1140" y1="906" x2="1140" y2="930"/>
      <line x1="1188" y1="906" x2="1188" y2="944"/><line x1="1236" y1="906" x2="1236" y2="930"/>
      <line x1="1284" y1="906" x2="1284" y2="944"/>
    </g>
    <rect x="180" y="906" width="1180" height="56" rx="8" fill="none" stroke="#C8A25C" stroke-width="3"/>
  </g>

  <!-- small bowl at right -->
  <g>
    <path d="M1384 742 L1470 742 C1470 782 1444 800 1427 800 C1410 800 1384 782 1384 742 Z" fill="#E8E1D2"/>
    <ellipse cx="1427" cy="742" rx="43" ry="11" fill="#F5EFE3"/>
    <rect x="1374" y="790" width="106" height="14" rx="7" fill="#CFC6B2"/>
  </g>
</svg>
